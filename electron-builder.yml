appId: io.mytracer.desktop
productName: MyTracer
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: false
electronDist: node_modules/electron/dist
directories:
  output: release
publish:
  provider: github
  owner: Fyrefly-4
  repo: MyTracer
  private: false
  channel: latest
files:
  - out/**/*
  - package.json
  - resources/brand/MyTracer-app-icon-256.png
win:
  icon: resources/brand/MyTracer.ico
  target:
    - target: nsis
      arch:
        - x64
artifactName: MyTracer-${version}-${arch}-setup.${ext}
nsis:
  include: build/installer/installer.nsh
  installerSidebar: resources/brand/installer-sidebar.bmp
  uninstallerSidebar: resources/brand/installer-sidebar.bmp
  installerIcon: resources/brand/MyTracer.ico
  uninstallerIcon: resources/brand/MyTracer.ico
  installerHeaderIcon: resources/brand/MyTracer.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
