appId: io.mytracer.desktop
productName: MyTracer
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: false
electronDist: node_modules/electron/dist
directories:
  output: release
publish:
  provider: github
  owner: Fyrefly-4
  repo: MyTracer
  private: true
  channel: latest
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
artifactName: MyTracer-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
