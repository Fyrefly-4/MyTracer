name: Update candidate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-candidate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'Fyrefly-4/MyTracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      MYTRACER_UPDATE_TOKEN: ''
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate historical main source for a tag rebuild
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/validate-candidate-source.mjs
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Install pinned Electron binary
        run: npm.cmd exec -- install-electron --no
      - name: Check task metadata
        run: npm.cmd run governance:metadata:check
      - name: Capture exact-source aggregate
        run: node tools/evidence/capture-command.mjs --task T084 --gate aggregate --output .tmp/evidence -- npm.cmd run verify
      - name: Build NSIS without publication
        run: node tools/evidence/capture-command.mjs --task T084 --gate package --output .tmp/evidence -- node node_modules/electron-builder/cli.js --win nsis --x64 --publish never
      - name: Validate isolated installation smoke
        run: node tools/evidence/capture-command.mjs --task T084 --gate package-smoke --output .tmp/evidence -- npm.cmd run test:package-smoke
      - name: Verify unsigned package policy
        shell: pwsh
        run: |
          $taskVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $taskSetup = Join-Path release "MyTracer-$taskVersion-x64-setup.exe"
          if ((Get-AuthenticodeSignature -LiteralPath $taskSetup).Status -ne 'NotSigned') {
            throw 'Unexpected signing policy; stop candidate capture.'
          }
      - name: Capture fixed candidate bundle
        run: node tools/release/create-candidate.mjs --output .tmp/release/candidate
      - name: Upload immutable candidate
        id: candidate_upload
        uses: actions/upload-artifact@v4.6.2
        with:
          name: update-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release/candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: Report upload receipt
        shell: pwsh
        env:
          TASK_ARTIFACT_ID: ${{ steps.candidate_upload.outputs.artifact-id }}
          TASK_ARTIFACT_DIGEST: ${{ steps.candidate_upload.outputs.artifact-digest }}
          TASK_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          TASK_CANDIDATE_REF: ${{ github.ref }}
        run: |
          "Candidate artifact ID: $env:TASK_ARTIFACT_ID" >> $env:GITHUB_STEP_SUMMARY
          "Archive digest: $env:TASK_ARTIFACT_DIGEST" >> $env:GITHUB_STEP_SUMMARY
          $taskVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $taskManifestHash = (Get-FileHash -LiteralPath .tmp/release/candidate/candidate-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "Version: $taskVersion" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:TASK_SOURCE_REVISION" >> $env:GITHUB_STEP_SUMMARY
          "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $env:GITHUB_STEP_SUMMARY
          "Artifact: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$env:TASK_ARTIFACT_ID" >> $env:GITHUB_STEP_SUMMARY
          "Manifest SHA-256: $taskManifestHash" >> $env:GITHUB_STEP_SUMMARY
          if ($env:TASK_CANDIDATE_REF -eq 'refs/heads/main' -or $env:TASK_CANDIDATE_REF -like 'refs/tags/v*') {
            "After this run succeeds, owner may approve this source by pushing tag v$taskVersion." >> $env:GITHUB_STEP_SUMMARY
          }
          "PR candidates cannot be formally published; accepted main sources are required." >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve command evidence including failures
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: update-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/evidence/*.json
          if-no-files-found: error
          retention-days: 14
