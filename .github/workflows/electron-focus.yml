name: Focused Electron

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Focused evidence only; does not replace CI Gate'
        type: choice
        required: true
        default: data-reading
        options: [data-reading, content-drafts, recovery-context]
      repeat:
        description: 'Independent runs; every run must pass (not retries)'
        type: choice
        required: true
        default: '1'
        options: ['1', '3']
  # Exercise this entrypoint itself before merge, not on every product PR.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/electron-focus.yml
      - tools/ci/focus-plan.mjs
      - tools/ci/run-phase.mjs
      - tests/e2e/recovery-context.e2e.test.ts
      - tests/unit/ci-focus.test.ts
      - tests/unit/ci-phase.test.ts
      - tests/support/focus-report-fixture.ts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'self-check' }}
  cancel-in-progress: true

jobs:
  focus:
    name: Focused Electron (not CI Gate)
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      FOCUS_PROFILE: ${{ github.event_name == 'pull_request' && 'recovery-context' || inputs.profile }}
      FOCUS_REPEAT: ${{ github.event_name == 'pull_request' && '3' || inputs.repeat }}
    steps:
      - name: Checkout PR test merge or selected manual revision
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Set up locked Node and npm cache
        id: npm-cache
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Validate bounded selection before installation
        run: node tools/ci/focus-plan.mjs
      - name: Install locked dependencies
        env:
          CI_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
        run: node tools/ci/run-phase.mjs install
      - name: Install pinned Electron binary
        run: node tools/ci/run-phase.mjs electron
      - name: Build current checkout
        run: node tools/ci/run-phase.mjs build
      - name: Prove actual Electron diagnostics
        run: node tools/ci/run-phase.mjs diagnostics
      - name: Run selected profile serially without retries
        run: node tools/ci/run-phase.mjs focus
      - name: Upload focused measurements and reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: electron-focus-phases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mytracer-ci-phases/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload isolated Electron evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: electron-focus-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mytracer-playwright-results/
          if-no-files-found: ignore
          retention-days: 7
