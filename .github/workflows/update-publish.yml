name: Publish accepted update

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: mytracer-private-update-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Fyrefly-4/MyTracer' && startsWith(github.ref, 'refs/tags/v') && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.actor == 'Fyrefly-4' && github.triggering_actor == 'Fyrefly-4'
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      selection: ${{ steps.prepare.outputs.selection }}
    steps:
      - name: Checkout trusted workflow revision only
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Read-only source and artifact validation
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/publish.mjs prepare

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted workflow revision only
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Revalidate and publish exact approved bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYTRACER_RELEASE_SELECTION: ${{ needs.validate.outputs.selection }}
        run: node tools/release/publish.mjs publish
