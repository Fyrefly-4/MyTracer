name: Publish accepted update

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full accepted main source SHA
        type: string
        required: true
      version:
        description: Reviewed stable app version; tag is v plus this version
        type: string
        required: true
      run_id:
        description: Exact completed main candidate run ID
        type: string
        required: true
      artifact_id:
        description: Exact reviewed immutable artifact ID
        type: string
        required: true
      manifest_sha256:
        description: Reviewed candidate-manifest SHA-256 in main acceptance ledger
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: mytracer-private-update-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Fyrefly-4/MyTracer' && github.ref == 'refs/heads/main' && github.actor == 'Fyrefly-4' && github.triggering_actor == 'Fyrefly-4'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow revision only
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Read-only source and artifact validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/publish.mjs prepare

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted workflow revision only
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Revalidate and publish exact approved bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/publish.mjs publish
