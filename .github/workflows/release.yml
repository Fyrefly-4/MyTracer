name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing approved release ID to recover
        required: true
        type: string
      tag:
        description: Exact stable tag (vX.Y.Z)
        required: true
        type: string
      source_sha:
        description: Exact merged release PR commit (40-character SHA)
        required: true
        type: string

env:
  RECOVERY_RELEASE_ID: ${{ inputs.release_id }}
  RECOVERY_TAG: ${{ inputs.tag }}
  RECOVERY_SOURCE_SHA: ${{ inputs.source_sha }}

permissions:
  contents: read

concurrency:
  group: mytracer-private-update-publication
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.repository == 'Fyrefly-4/MyTracer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Listing draft releases for safe retry requires push access.
      contents: write
      pull-requests: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up locked Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Require release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.MYTRACER_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.MYTRACER_RELEASE_APP_PRIVATE_KEY }}
        run: node tools/release/check-app-config.mjs
      - name: Create repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MYTRACER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MYTRACER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: MyTracer
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Maintain release PR or create approved draft
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select exact approved release including retry
        id: select
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: node tools/release/release-pr.mjs select

  build:
    needs: release-pr
    if: needs.release-pr.outputs.selection != ''
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      MYTRACER_UPDATE_TOKEN: ''
      MYTRACER_RELEASE_SELECTION: ${{ needs.release-pr.outputs.selection }}
    steps:
      - name: Checkout exact approved release revision
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ fromJSON(needs.release-pr.outputs.selection).sourceRevision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Install pinned Electron binary
        run: npm.cmd exec -- install-electron --no
      - name: Verify exact release source
        run: npm.cmd run verify
      - name: Build NSIS without publication
        run: node node_modules/electron-builder/cli.js --win nsis --x64 --publish never
      - name: Validate isolated installation smoke
        run: npm.cmd run test:package-smoke
      - name: Verify unsigned package policy
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Join-Path release "MyTracer-$version-x64-setup.exe"
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'NotSigned') {
            throw 'Unexpected signing policy.'
          }
      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .tmp/release-tooling
          persist-credentials: false
      - name: Validate and collect updater files
        run: node .tmp/release-tooling/tools/release/release-pr.mjs bundle
      - name: Transfer tested bytes within this run
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-assets-${{ fromJSON(needs.release-pr.outputs.selection).sourceRevision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/release-pr/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release-pr, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      MYTRACER_RELEASE_SELECTION: ${{ needs.release-pr.outputs.selection }}
    steps:
      - name: Checkout exact approved release revision
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ fromJSON(needs.release-pr.outputs.selection).sourceRevision }}
          persist-credentials: false
      - name: Set up locked Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .tmp/release-tooling
          persist-credentials: false
      - name: Require release App configuration
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.MYTRACER_RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.MYTRACER_RELEASE_APP_PRIVATE_KEY }}
        run: node tools/release/check-app-config.mjs
      - name: Create repository-scoped release App token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.MYTRACER_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MYTRACER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: MyTracer
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Download tested bytes from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-assets-${{ fromJSON(needs.release-pr.outputs.selection).sourceRevision }}-${{ github.run_id }}-*
          merge-multiple: false
          path: .tmp/release-download
      - name: Select the latest successful build attempt
        shell: bash
        run: |
          node .tmp/release-tooling/tools/release/select-run-assets.mjs
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: node .tmp/release-tooling/tools/release/release-pr.mjs publish
