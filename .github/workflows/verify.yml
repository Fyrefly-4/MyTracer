name: Verification

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-required:
    name: Windows required gate
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Restore exact dependencies
        run: npm.cmd ci
      - name: Restore the approved Electron binary
        run: npm.cmd exec -- install-electron --no
      - name: Validate governance metadata
        run: npm.cmd run governance:metadata:check
      - name: Verify the repository
        run: npm.cmd run evidence:verify
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: verification-evidence-${{ github.run_id }}
          path: .tmp/evidence/*.json
          if-no-files-found: warn
          retention-days: 7
