name: Verification

on:
  pull_request:
    branches: [main, experiment/ui-ux-20261022, experiment/perspective-20261027]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Gate
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout PR test merge or selected revision
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up locked Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Select checks for changed files
        id: changes
        run: node tools/ci/classify-changes.mjs classify
      - name: Require a valid check selection
        shell: pwsh
        env:
          CHECK_CATEGORY: ${{ steps.changes.outputs.category }}
        run: |
          if ($env:CHECK_CATEGORY -notin @('documentation', 'release-tooling', 'source')) {
            throw 'Missing or invalid CI classification'
          }
      - name: Check changed documentation
        env:
          BASE_REVISION: ${{ steps.changes.outputs.base_revision }}
          HEAD_REVISION: ${{ steps.changes.outputs.head_revision }}
        run: node tools/ci/classify-changes.mjs docs
      - name: Check diff integrity
        shell: pwsh
        env:
          BASE_REVISION: ${{ steps.changes.outputs.base_revision }}
          HEAD_REVISION: ${{ steps.changes.outputs.head_revision }}
        run: |
          if ($env:BASE_REVISION -and $env:BASE_REVISION -notmatch '^0+$') {
            git diff --check $env:BASE_REVISION $env:HEAD_REVISION
          } else {
            git show --check --format= $env:HEAD_REVISION
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enable npm download cache
        id: npm-cache
        if: steps.changes.outputs.category != 'documentation'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependencies
        if: steps.changes.outputs.category == 'source'
        env:
          CI_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
        run: node tools/ci/run-phase.mjs install
      - name: Install locked tooling dependencies without lifecycle scripts
        if: steps.changes.outputs.category == 'release-tooling'
        run: npm.cmd ci --ignore-scripts
      - name: Verify release tooling
        if: steps.changes.outputs.category == 'release-tooling'
        run: npm.cmd run verify:release-tooling
      - name: Install pinned Electron binary
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs electron
      - name: Verify format
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs format
      - name: Verify lint
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs lint
      - name: Verify types
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs types
      - name: Verify unit tests
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs unit
      - name: Verify integration tests
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs integration
      - name: Verify application build
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs build
      - name: Prove Electron failure diagnostics
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs diagnostics
      - name: Repeat Data scroll restoration three times
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs scroll
      - name: Verify Electron E2E
        if: steps.changes.outputs.category == 'source'
        run: node tools/ci/run-phase.mjs e2e
      - name: Upload phase measurements
        if: always() && steps.changes.outputs.category == 'source'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-phases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mytracer-ci-phases/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload failure diagnostics
        if: always() && steps.changes.outputs.category == 'source'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mytracer-playwright-results/
          if-no-files-found: ignore
          retention-days: 7
